<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusBoard – Task Manager + Focus Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>FocusBoard</h1>
    <p id="clock" aria-live="off"></p>
  </header>

  <main class="layout">
    <!-- TASKS -->
    <section class="panel" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Tasks</h2>

      <form id="task-form" novalidate>
        <div class="field">
          <label for="task-title">Task</label>
          <input type="text" id="task-title" placeholder="e.g. Finish the fetch API exercise" />
          <small class="error" id="title-error"></small>
        </div>

        <div class="row">
          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="task-due">Due date</label>
            <input type="date" id="task-due" />
            <small class="error" id="due-error"></small>
          </div>
        </div>

        <button type="submit" class="btn primary">Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="active">Active</button>
          <button class="filter" data-filter="done">Done</button>
        </div>
        <button id="clear-done" class="btn ghost">Clear done</button>
      </div>

      <p id="stats" class="stats"></p>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty" class="empty" hidden>No tasks here. Add one above to get started.</p>
    </section>

    <!-- SIDE -->
    <aside class="side">
      <section class="panel" aria-labelledby="timer-title">
        <h2 id="timer-title">Focus timer</h2>
        <div id="timer-display" class="timer">25:00</div>
        <div class="row">
          <button id="timer-start" class="btn primary">Start</button>
          <button id="timer-pause" class="btn">Pause</button>
          <button id="timer-reset" class="btn ghost">Reset</button>
        </div>
        <label for="timer-minutes" class="inline">Minutes
          <input type="number" id="timer-minutes" min="1" max="120" value="25" />
        </label>
        <p id="sessions" class="stats"></p>
      </section>

      <section class="panel" aria-labelledby="quote-title">
        <h2 id="quote-title">Quote of the moment</h2>
        <blockquote id="quote">Loading…</blockquote>
        <button id="quote-btn" class="btn ghost">New quote</button>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
